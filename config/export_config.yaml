# VinDr-Mammo export configuration for the third square-crop dataset (-v3).
# Goal:
#   Train split: deterministic sliding-window crops, but keep ONLY positive crops.
#                A positive crop means at least one mass bounding box remains after
#                applying the crop annotation policy below.
#   Val/test:    deterministic sliding-window crops with empty windows included,
#                so evaluation still reflects the realistic detection task.
# Run with one of:
#   python main.py
#   vindr-mammo-export --config config/export_config.yaml

paths:
  # Folder containing metadata.csv, breast-level_annotations.csv,
  # finding_annotations.csv, and images/<study_id>/<image_id>.dicom
  data_root: "/mnt/t9/vindr"

  # New output folder for this experiment. The -v3 suffix is intentional.
  output_root: "/mnt/t9/preprocessed-vindr-v3"

runtime:
  show_progress: true

image:
  # Keep numeric DICOM values until export-time windowing.
  normalize: "none"
  percentile_range: [0.5, 99.5]
  use_voi_lut: false

preprocess:
  # Applied before square-crop export.
  invert_to_black_background: true
  crop_breast: true
  mirror_right_to_left: true
  crop_padding: 20
  crop_threshold: null

image_export:
  # RGB training PNGs: R = intensity, G = equalized intensity, B = Sobel gradient.
  rgb_scheme: "intensity_equalized_gradient"

  # Used only when rgb_scheme = "multi_window".
  multi_window_percentiles:
    - [0.5, 99.5]
    - [1.0, 99.0]
    - [2.0, 98.0]

  # Used by grayscale_rgb, equalized_rgb, and fallback paths.
  single_window: [1.0, 99.0]

  # Used when rgb_scheme = "intensity_equalized_gradient".
  intensity_equalized_gradient:
    intensity_window: [1.0, 99.0]
    gradient_source: "normal"     # "normal" or "equalized"
    gradient_window: [1.0, 99.0]
    gradient_ksize: 3

histogram_equalization:
  # For rgb_scheme="intensity_equalized_gradient", the second channel is already
  # equalized inside the scheme, so this global post-equalization is skipped.
  enabled: true
  apply_to: "third_channel"       # "all_channels", "third_channel", or "none"

preserved_16bit:
  # Save 16-bit grayscale PNGs for inspection/data integrity, not YOLO input.
  save: true
  percentile_range: [0.1, 99.9]
  use_foreground_mask: true

metadata:
  save_full_source_csvs: true
  include_dicom_meta: true

splits:
  # Keep official VinDr test as test, then split official training studies into
  # train and validation at study level.
  val_fraction_from_training: 0.15
  seed: 123

export:
  # Keep false unless you intentionally want to delete output_root before export.
  clean_output_root: false
  save_square_crops: true

  # Disable baseline export for this experiment. This run is only the -v3 crop dataset.
  save_baseline_uncropped: false

  # Empty label files are still written for val/test empty crops. The train split
  # should have no empty crops when train_deterministic_include_empty=false.
  save_empty_label_files: true

square_crops:
  # Final n x n object-detection crops after preprocessing.
  crop_size: 1024
  stride: 512

  # All splits use deterministic sliding windows.
  train_crop_mode: "deterministic"
  val_crop_mode: "deterministic"
  test_crop_mode: "deterministic"

  # Global default for deterministic crops. Leave true so val/test include all windows.
  deterministic_include_empty: true

  # Critical v3 setting: train is deterministic, but positive-only.
  # This removes deterministic train windows whose final crop contains no mass box.
  train_deterministic_include_empty: false

  # Keep validation/test realistic by including empty sliding windows.
  val_deterministic_include_empty: true
  test_deterministic_include_empty: true

  deterministic_max_windows_per_image: null
  train_deterministic_max_windows_per_image: null
  val_deterministic_max_windows_per_image: null
  test_deterministic_max_windows_per_image: null

  # Random crop options below are ignored while all split crop modes are deterministic.
  # They are kept so you can switch train_crop_mode back to "random" later.
  random_crops_per_annotation: 5
  balance_train_positive_fraction_globally: true
  random_crops_per_negative_image_when_balancing: 0
  random_crops_per_negative_image: 1
  positive_fraction: 0.80
  center_shift_fraction: 0.25
  max_random_tries: 80
  seed: 123

  # If a breast-cropped image is smaller than 1024 in either direction, pad it.
  pad_if_needed: true
  pad_value: 0.0

crop_annotation_policy:
  # This policy defines whether a crop counts as containing a bounding box.
  # Current default: a mass annotation is kept only if the full box is inside the crop.
  # Therefore, train positive-only crops contain complete mass boxes and avoid crops
  # that cut through a lesion.
  allow_partial_annotations: false
  min_box_visibility: 0.30
  reject_partial_windows: true
  negative_max_box_visibility: 0.0

dataset:
  validate_paths: false

visualizations:
  # Fast plots from already-exported CSV/JSON files. No DICOM reread.
  output_dir: "/mnt/t9/preprocessed-vindr-v3/visualizations"
  include_square_crops: true
  include_baseline_uncropped: false
  write_html_report: true
  max_rows_per_samples_csv: null
