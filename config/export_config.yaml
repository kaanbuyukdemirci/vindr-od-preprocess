# VinDr-Mammo export configuration for the second square-crop dataset.
# Goal: remove the train-vs-val/test crop-distribution mismatch.
# Train, validation, and test all use deterministic 1024x1024 sliding-window crops.
# Run with: vindr-mammo-export --config config/export_config.yaml

paths:
  # Folder containing metadata.csv, breast-level_annotations.csv,
  # finding_annotations.csv, and images/<study_id>/<image_id>.dicom
  data_root: "/mnt/t9/vindr"

  # All exported images, labels, COCO JSON files, stats, and metadata are saved here.
  # This is intentionally a new folder so the previous random-training dataset is preserved.
  output_root: "/mnt/t9/preprocessed-vindr-v2"

runtime:
  show_progress: true

image:
  # Keep numeric DICOM values until export-time windowing.
  normalize: "none"
  percentile_range: [0.5, 99.5]
  use_voi_lut: false

preprocess:
  # Applied before baseline and square-crop export.
  invert_to_black_background: true
  crop_breast: true
  mirror_right_to_left: true
  crop_padding: 20
  crop_threshold: null

image_export:
  # Training images saved under images/<split> are RGB PNGs.
  # Current experiment: R = intensity, G = equalized intensity, B = Sobel gradient.
  rgb_scheme: "intensity_equalized_gradient"

  # Used only when rgb_scheme = "multi_window".
  multi_window_percentiles:
    - [0.5, 99.5]
    - [1.0, 99.0]
    - [2.0, 98.0]

  # Used by grayscale_rgb, equalized_rgb, and fallback paths.
  single_window: [1.0, 99.0]

  # Used when rgb_scheme = "intensity_equalized_gradient".
  intensity_equalized_gradient:
    intensity_window: [1.0, 99.0]
    gradient_source: "normal"     # "normal" or "equalized"
    gradient_window: [1.0, 99.0]
    gradient_ksize: 3

histogram_equalization:
  # For rgb_scheme="intensity_equalized_gradient", the second channel is already
  # equalized inside the scheme, so this global post-equalization is skipped.
  enabled: true
  apply_to: "third_channel"       # "all_channels", "third_channel", or "none"

preserved_16bit:
  # Save 16-bit grayscale PNGs for inspection/data integrity, not YOLO input.
  save: true
  percentile_range: [0.1, 99.9]
  use_foreground_mask: true

metadata:
  save_full_source_csvs: true
  include_dicom_meta: true

splits:
  # Keep official VinDr test as test, then split official training studies into
  # train and validation at study level.
  val_fraction_from_training: 0.15
  seed: 123

export:
  # Keep false unless you intentionally want to delete output_root before export.
  clean_output_root: false
  save_square_crops: true

  # Disable the baseline export for this dataset. The purpose of this run is to
  # create a new square-crop dataset with matched train/val/test crop generation.
  save_baseline_uncropped: false

  # Keep empty label files so image count equals label count for Ultralytics.
  save_empty_label_files: true

square_crops:
  # Final n x n object-detection crops after preprocessing.
  crop_size: 1024
  stride: 512

  # Critical change from the previous dataset:
  # all splits now use deterministic sliding windows.
  # This makes train look like val/test and removes the mass-centered random-crop bias.
  train_crop_mode: "deterministic"
  val_crop_mode: "deterministic"
  test_crop_mode: "deterministic"

  # Deterministic crop options used by train/val/test.
  deterministic_include_empty: true
  deterministic_max_windows_per_image: null

  # Random crop options below are ignored while train_crop_mode="deterministic".
  # They are kept so you can switch train_crop_mode back to "random" later.
  random_crops_per_annotation: 5
  balance_train_positive_fraction_globally: true
  random_crops_per_negative_image_when_balancing: 0
  random_crops_per_negative_image: 1
  positive_fraction: 0.80
  center_shift_fraction: 0.25
  max_random_tries: 80
  seed: 123

  # If a breast-cropped image is smaller than 1024 in either direction, pad it.
  pad_if_needed: true
  pad_value: 0.0

crop_annotation_policy:
  # Same policy as before for apples-to-apples comparison.
  # false means a mass annotation is kept only when the complete box is inside the crop.
  # If later you see many partial lesions becoming unlabeled negatives, try:
  # allow_partial_annotations: true
  # min_box_visibility: 0.30
  allow_partial_annotations: false
  min_box_visibility: 0.30
  reject_partial_windows: true
  negative_max_box_visibility: 0.0

dataset:
  validate_paths: false

visualizations:
  # Fast plots from already-exported CSV/JSON files. No DICOM reread.
  output_dir: "/mnt/t9/preprocessed-vindr-v2/visualizations"
  include_square_crops: true
  include_baseline_uncropped: false
  write_html_report: true
  max_rows_per_samples_csv: null
