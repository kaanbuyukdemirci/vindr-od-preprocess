paths:
  data_root: /mnt/t9/vindr
  output_root: /mnt/t9/preprocessed-vindr-v3
runtime:
  show_progress: true
image:
  normalize: none
  percentile_range:
  - 0.5
  - 99.5
  use_voi_lut: false
preprocess:
  invert_to_black_background: true
  crop_breast: false
  mirror_right_to_left: true
  crop_padding: 20
  crop_threshold: null
image_export:
  rgb_scheme: custom_channel_pipeline
  multi_window_percentiles:
  - - 0.5
    - 99.5
  - - 1.0
    - 99.0
  - - 2.0
    - 98.0
  single_window:
  - 1.0
  - 99.0
  intensity_equalized_gradient:
    intensity_window:
    - 1.0
    - 99.0
    gradient_source: normal
    gradient_window:
    - 1.0
    - 99.0
    gradient_ksize: 3
  custom_channel_pipeline:
    R:
      source: current_crop
      steps:
      - op: percentile_normalize
        params:
          percentiles:
          - 1.0
          - 99.0
      - op: hist_equalize
        params: {}
      - op: standardize_to_target
        params:
          target_mean: 0.5
          target_std: 0.2
          stat_percentiles:
          - 1.0
          - 99.0
          clip_output: true
    G:
      source: current_crop
      steps:
      - op: percentile_normalize
        params:
          percentiles:
          - 1.0
          - 99.0
      - op: hist_equalize
        params: {}
      - op: percentile_normalize
        params:
          percentiles:
          - 70.0
          - 100.0
      - op: hist_equalize
        params: {}
      - op: standardize_to_target
        params:
          target_mean: 0.5
          target_std: 0.2
          stat_percentiles:
          - 1.0
          - 99.0
          clip_output: true
    B:
      source: contralateral_same_view_crop
      steps:
      - op: percentile_normalize
        params:
          percentiles:
          - 1.0
          - 99.0
      - op: hist_equalize
        params: {}
      - op: standardize_to_target
        params:
          target_mean: 0.5
          target_std: 0.2
          stat_percentiles:
          - 1.0
          - 99.0
          clip_output: true
  contralateral_note: B channel uses the same crop coordinates from the opposite breast
    with the same view position when available.
histogram_equalization:
  enabled: false
  apply_to: third_channel
preserved_16bit:
  save: true
  percentile_range:
  - 0.1
  - 99.9
  use_foreground_mask: true
metadata:
  save_full_source_csvs: true
  include_dicom_meta: true
splits:
  val_fraction_from_training: 0.15
  seed: 123
export:
  clean_output_root: false
  save_square_crops: true
  save_baseline_uncropped: false
  save_empty_label_files: true
square_crops:
  crop_size: 1024
  stride: 512
  train_crop_mode: deterministic
  val_crop_mode: deterministic
  test_crop_mode: deterministic
  deterministic_include_empty: true
  train_deterministic_include_empty: false
  val_deterministic_include_empty: true
  test_deterministic_include_empty: true
  deterministic_max_windows_per_image: null
  train_deterministic_max_windows_per_image: null
  val_deterministic_max_windows_per_image: null
  test_deterministic_max_windows_per_image: null
  deterministic_require_foreground: false
  deterministic_min_foreground_fraction: 0.05
  deterministic_foreground_threshold: null
  train_deterministic_require_foreground: null
  val_deterministic_require_foreground: null
  test_deterministic_require_foreground: null
  train_deterministic_min_foreground_fraction: null
  val_deterministic_min_foreground_fraction: null
  test_deterministic_min_foreground_fraction: null
  random_crops_per_annotation: 5
  balance_train_positive_fraction_globally: true
  random_crops_per_negative_image_when_balancing: 0
  random_crops_per_negative_image: 1
  positive_fraction: 0.8
  center_shift_fraction: 0.25
  max_random_tries: 80
  seed: 123
  pad_if_needed: true
  pad_value: 0.0
  train_deterministic_selection_mode: mass_only
  val_deterministic_selection_mode: all
  test_deterministic_selection_mode: all
  deterministic_target_positive_ratio: 0.8
  train_deterministic_target_positive_ratio: 0.8
  val_deterministic_target_positive_ratio: 0.8
  test_deterministic_target_positive_ratio: 0.8
crop_annotation_policy:
  allow_partial_annotations: false
  min_box_visibility: 0.3
  reject_partial_windows: true
  negative_max_box_visibility: 0.0
dataset:
  validate_paths: false
visualizations:
  output_dir: /mnt/t9/preprocessed-vindr-v3/visualizations
  include_square_crops: true
  include_baseline_uncropped: false
  write_html_report: true
  max_rows_per_samples_csv: null
vendor_filter:
  enabled: false
  include_vendors: []
