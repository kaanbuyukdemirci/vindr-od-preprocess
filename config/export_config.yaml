paths:
  data_root: /mnt/t9/vindr
  output_root: /mnt/t9/preprocessed-vindr-v56
runtime:
  show_progress: true
  simple_profiler_enabled: true
  simple_profiler_emit_every: 10
image:
  normalize: none
  percentile_range:
  - 0.5
  - 99.5
  use_voi_lut: false
preprocess:
  invert_to_black_background: true
  crop_breast: false
  mirror_right_to_left: true
  crop_padding: 20
  crop_threshold: null
  min_component_area_fraction: 0.001
image_export:
  rgb_scheme: custom_channel_pipeline
  multi_window_percentiles:
  - - 0.5
    - 99.5
  - - 1.0
    - 99.0
  - - 2.0
    - 98.0
  single_window:
  - 1.0
  - 99.0
  intensity_equalized_gradient:
    intensity_window:
    - 1.0
    - 99.0
    gradient_source: normal
    gradient_window:
    - 1.0
    - 99.0
    gradient_ksize: 3
  contralateral_source_alignment:
    enabled: true
    method: nipple_y
    fallback_method: mask_centroid_y
    threshold: null
    tip_side: auto
    tip_tolerance_fraction: 0.006
    tip_tolerance_px: null
    smooth_rows: 21
    projection_smooth_rows: 31
    boundary_smooth_rows: 21
    max_shift_fraction: 0.1
    min_profile_overlap_fraction: 0.6
    min_profile_score: 0.05
    profile_score_margin: 0.03
    max_profile_nipple_disagreement_fraction: 0.05
    max_profile_nipple_disagreement_px: null
    pad_value: 0.0
  custom_channel_pipeline:
    R:
      source: current_crop
      steps:
      - op: percentile_normalize
        params:
          percentiles:
          - 0.0
          - 100.0
      - op: hist_equalize
        params: {}
    G:
      source: current_crop
      steps:
      - op: percentile_normalize
        params:
          percentiles:
          - 0.0
          - 100.0
      - op: hist_equalize
        params: {}
      - op: clahe
        params:
          clip_limit: 8.0
          tile_grid_size: 8
    B:
      source: contralateral_same_view_crop
      steps:
      - op: percentile_normalize
        params:
          percentiles:
          - 0.0
          - 100.0
      - op: hist_equalize
        params: {}
histogram_equalization:
  enabled: true
  apply_to: third_channel
preserved_16bit:
  save: true
  percentile_range:
  - 0.1
  - 99.9
  use_foreground_mask: true
metadata:
  save_full_source_csvs: true
  include_dicom_meta: true
splits:
  val_fraction_from_training: 0.15
  seed: 123
export:
  clean_output_root: false
  save_square_crops: true
  save_baseline_uncropped: false
  save_empty_label_files: true
square_crops:
  crop_size: 1024
  stride: 512
  train_crop_mode: bbox_safe_random
  val_crop_mode: bbox_safe_random
  test_crop_mode: bbox_safe_random
  random_crops_per_annotation: 1
  balance_train_positive_fraction_globally: true
  random_crops_per_negative_image_when_balancing: 1
  random_crops_per_negative_image: 1
  positive_fraction: 0.5
  train_positive_fraction: 0.5
  val_positive_fraction: 0.5
  test_positive_fraction: 0.5
  train_bbox_safe_positive_fraction: 0.5
  val_bbox_safe_positive_fraction: 0.5
  test_bbox_safe_positive_fraction: 0.5
  train_deterministic_selection_mode: positive_ratio
  val_deterministic_selection_mode: positive_ratio
  test_deterministic_selection_mode: positive_ratio
  train_deterministic_target_positive_ratio: 0.5
  val_deterministic_target_positive_ratio: 0.5
  test_deterministic_target_positive_ratio: 0.5
  center_shift_fraction: 0.25
  max_random_tries: 80
  bbox_safe_boundary_margin_fraction: 0.02
  bbox_safe_random_shift_fraction: 0.35
  bbox_safe_candidate_count: 120
  bbox_safe_top_k: 8
  bbox_safe_breast_bias_strength: 1.0
  bbox_safe_left_bias_strength: 0.25
  bbox_safe_projection_bias_strength: 0.25
  bbox_safe_foreground_threshold: null
  bbox_safe_skip_unsafe_fallbacks: true
  seed: 123
  deterministic_include_empty: true
  deterministic_max_windows_per_image: null
  pad_if_needed: true
  pad_value: 0.0
  deterministic_require_foreground: false
  deterministic_min_foreground_fraction: 0.05
  deterministic_foreground_threshold: null
  contralateral_preprocessed_cache_items: 32
  contralateral_alignment_cache_items: 64
  bbox_safe_crops_per_annotation: 1
  bbox_safe_random_crops_per_negative_image_when_balancing: 1
  global_positive_ratio_selection_for_random: false
  online_positive_ratio_selection_for_random: true
  online_balance_shuffle_source_records: true
  global_negative_candidate_crops_per_image_when_balancing: 1
crop_annotation_policy:
  allow_partial_annotations: true
  min_box_visibility: 0.3
  reject_partial_windows: false
  negative_max_box_visibility: 0.0
dataset:
  validate_paths: false
visualizations:
  output_dir: /mnt/t9/preprocessed-vindr-v56/visualizations
  include_square_crops: true
  include_baseline_uncropped: true
  write_html_report: true
  max_rows_per_samples_csv: null
